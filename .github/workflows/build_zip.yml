name: Create Blender ZIP

"on":
  workflow_dispatch:

  push:
    paths:
      - "condor_buildings/**"
      - "README.md"
      - "LICENSE"

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get addon version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import re
          text = open("condor_buildings/__init__.py", encoding="utf-8").read()
          match = re.search(r'"version"\s*:\s*\((.*?)\)', text, re.S)
          if not match:
              raise Exception("Version not found")
          print(match.group(1).replace(",", ".").replace(" ", ""))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Blender ZIP package
        run: |
          cp README.md condor_buildings/
          cp LICENSE condor_buildings/
          zip -r condor_buildings.zip condor_buildings

      - name: Create or update Release and upload ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" condor_buildings.zip --clobber
          else
            gh release create "$TAG" \
              condor_buildings.zip \
              --title "Condor Buildings $TAG"
          fi

name: Create Blender ZIP

"on":
  workflow_dispatch:

  push:
    paths:
      - "condor_buildings/**"
      - "README.md"
      - "LICENSE"

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get addon version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import re
          text = open("condor_buildings/__init__.py", encoding="utf-8").read()
          match = re.search(r'"version"\s*:\s*\((.*?)\)', text, re.S)
          if match:
              print(match.group(1).replace(",", ".").replace(" ", ""))
          else:
              raise Exception("Version not found")
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Blender ZIP package
        run: |
          cp README.md condor_buildings/
          cp LICENSE condor_buildings/
          zip -r condor_buildings.zip condor_buildings

      - name: Create Release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Condor Buildings v${{ steps.version.outputs.version }}
          files: condor_buildings.zip
